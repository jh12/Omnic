name: release
on:
  push:
    branches:
      - main
      - dev

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.3.3
      with:
        versionSpec: '6.6.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.3.3
    # QEMU
    - name: Setup QEMU
      uses: docker/setup-qemu-action@v4
    # Buildx
    - name: Setup Docker BuildX
      uses: docker/setup-buildx-action@v4
    # Docker login
    - name: Login to GitHub Container Registry
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    # Login, build & publish docker image
    - name: Build and push
      id: docker_build
      uses: docker/build-push-action@v6
      with:
        file: Dockerfile
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/omnic:${{ steps.gitversion.outputs.Major }}.${{ steps.gitversion.outputs.Minor }}
          ghcr.io/${{ github.repository_owner }}/omnic:${{ steps.gitversion.outputs.Major }}.${{ steps.gitversion.outputs.Minor }}.${{ steps.gitversion.outputs.Patch }}-${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
        build-args: RELEASE_VERSION=${{ steps.gitversion.outputs.Major }}.${{ steps.gitversion.outputs.Minor }}.${{ steps.gitversion.outputs.Patch }}-${{ steps.gitversion.outputs.CommitsSinceVersionSource }}
        platforms: linux/arm64