name: build
on: 
  push:
    branches-ignore:
      - main
      - develop
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
    - name: Install GitVersion
      uses: gittools/actions/gitversion/setup@v4.3.3
      with:
        versionSpec: '6.6.x'
    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v4.3.3
    - run: | 
        echo "FullSemVer: ${{ steps.gitversion.outputs.fullSemVer }}"
    - name: Setup .NET SDK 10.0.x
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10
    - name: Install dependencies
      run: dotnet restore
    # - name: Format
    #   run: dotnet format --verify-no-changes
    - name: Build
      run: dotnet build --configuration Release --no-restore --WarnAsError /p:Version=${{ steps.gitversion.outputs.Major }}.${{ steps.gitversion.outputs.Minor }}.${{ steps.gitversion.outputs.Patch }}-${{ steps.gitversion.outputs.CommitsSinceVersionSource:0000 }}